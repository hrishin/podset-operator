apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podsets.demo.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only, this is a demo/tutorial CRD not intended for production"
spec:
  group: demo.k8s.io
  scope: Namespaced
  names:
    kind: PodSet
    plural: podsets
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 0
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
